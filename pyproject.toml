[project]
name = "olist-warehouse-agent"
version = "0.1.0"
description = "A small, grounded analytics agent for the Olist Azure PostgreSQL warehouse"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "openai>=1.68,<3",
  "pydantic-settings>=2.8,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]
azure = ["azure-identity>=1.21,<2", "azure-monitor-opentelemetry>=1.6,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
